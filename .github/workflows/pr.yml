name: PR checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            result=$(git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" | python scripts/classify_changes.py)
            echo "backend=$result" >> "$GITHUB_OUTPUT"
          fi
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vnext
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vnext -d vnext_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://vnext:test-only@localhost:5432/vnext_test
      TEST_DATABASE_URL: postgresql+psycopg://vnext:test-only@localhost:5432/vnext_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff check backend
      - run: python -m pytest backend/tests
      - run: alembic -c backend/alembic.ini upgrade head
  result:
    name: PR result
    if: always()
    needs: [changes, docs, backend]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      BACKEND_NEEDED: ${{ needs.changes.outputs.backend }}
    steps:
      - shell: bash
        run: |
          [[ "$CHANGES_RESULT" == success && "$DOCS_RESULT" == success ]] || exit 1
          if [[ "$BACKEND_NEEDED" == true ]]; then
            [[ "$BACKEND_RESULT" == success ]] || exit 1
          else
            [[ "$BACKEND_NEEDED" == false && "$BACKEND_RESULT" == skipped ]] || exit 1
          fi
