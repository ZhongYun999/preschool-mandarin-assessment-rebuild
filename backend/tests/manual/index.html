<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地 QA 测试工作台</title><style>body{font:16px system-ui;max-width:1000px;margin:2em auto;padding:0 1em;color:#202933}section{border:1px solid #ccd4de;border-radius:8px;padding:1em;margin:1em 0}button,select,input{font:inherit;padding:.5em;margin:.25em}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:1em} .notice{background:#fff2cc;padding:1em}audio{display:block;margin:1em 0}</style></head><body>
<h1>本地 QA 测试工作台</h1><p class="notice">仅供研发测试。题目音频是无语义的提示音，仅用于播放协议测试。所有识别和评价均为离线 Mock；候选原始评价，不代表正式成绩。</p>
<section><h2>场次</h2><button id="create">准备单题场次</button><button id="createTwo">准备两题场次</button><select id="sessions"></select><button id="open">打开场次</button><button id="refresh">刷新服务端状态</button><label>当前题目 <select id="tasks"></select></label><p id="session"></p><pre id="state"></pre></section>
<section><h2>题目与播放</h2><p id="prompt"></p><button id="start">显式开始本题</button><button id="guide">播放 GUIDE</button><button id="initial">播放 INITIAL_PROMPT</button><button id="replay">主动重听 USER_REPLAY</button><button id="retry">技术重试 TECHNICAL_RETRY</button><button id="stopPlay">中断播放</button><button id="recoverPlay">报告未完成播放</button><button id="redo">显式整题重做</button></section>
<section><h2>录音及正式提交</h2><button id="record">创建录音并开始麦克风</button><button id="stopRecord">结束录音并上传</button><input type="file" id="file" accept="audio/*"><button id="useFile">使用所选音频文件</button><button id="upload">上传或重试原始录音</button><button id="cancel">取消服务端录音</button><audio id="preview" controls></audio><p id="audioInfo"></p><button id="submit">确认正式提交 QA</button></section>
<section><h2>评价工作台</h2><p>候选原始评价，不代表正式成绩。仅运行离线 Mock；不会调用收费服务。</p><button id="run">手动执行离线评价</button><select id="jobs"></select><button id="retryJob">明确授权重试所选作业</button><pre id="diagnostics"></pre></section><p id="message" role="status"></p><script src="/dev/qa/app.js"></script></body></html>
